<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1220" viewBox="0 0 1440 1220" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">Vapor — 当前实现架构</title>
<desc id="desc">单控制平面使用 SQLite 任务租约；区域 Agent 主动建立 WebSocket 与 HTTP 连接；插件与 Agent 同进程；Redis 与可观测服务为可选组件。</desc>
