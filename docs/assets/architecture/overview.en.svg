<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1220" viewBox="0 0 1440 1220" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Vapor — implemented architecture</title>
<desc id="desc">Single control plane with SQLite task leases. Regional agents initiate WebSocket and HTTP connections. Plugins share the agent process. Redis and observability services are optional.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#39708d"/></marker></defs><style>text{font-family:"Noto Sans CJK SC",Inter,"Microsoft YaHei",sans-serif;fill:#193448} .title{font-size:34px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:18px}.small{font-size:18px;fill:#486477}.line{fill:none;stroke:#39708d;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}.optional{stroke-dasharray:8 6}</style><rect width="1440" height="1220" fill="#f5f8fa"/>
<text x="40" y="52" class="title">VAPOR / architecture overview</text>
<text x="40" y="84" class="small">Source-verified • 2026-10-30 • .NET 10 • single operator / multiple regions</text>
<rect x="40" y="110" width="910" height="78" rx="12" fill="#fff" stroke="#c7d5df"/>
<text x="60" y="144" class="head">Operator / CLI / built-in web consoles</text>
<text x="60" y="176" class="body">REST /v1 • OpenAPI • admin.html / dashboard.html / gamedata.html</text>
<path d="M490 188 V234" class="line both"/>
<text x="514" y="218" class="small">HTTPS requests / live SSE</text>
<rect x="40" y="238" width="910" height="352" rx="12" fill="#eaf2f8" stroke="#9ab5c9"/>
<text x="60" y="274" class="head">CONTROL PLANE / one process, single state writer</text>
<rect x="60" y="292" width="275" height="126" rx="12" fill="#fff" stroke="#c7d5df"/>
<text x="80" y="326" class="head">API edge + events</text>
<text x="80" y="358" class="body">Admin / agent / viewer keys</text>
<text x="80" y="386" class="body">Rate limits • audit redaction</text>
<text x="80" y="414" class="body">EventBroker • webhooks</text>
<rect x="355" y="292" width="275" height="126" rx="12" fill="#fff" stroke="#c7d5df"/>
<text x="375" y="326" class="head">Orchestration</text>
<text x="375" y="358" class="body">DesiredStateReconciler</text>
<text x="375" y="386" class="body">Recurring jobs / script flows</text>
<text x="375" y="414" class="body">Crawl / storage collection</text>
<rect x="650" y="292" width="280" height="126" rx="12" fill="#fff" stroke="#c7d5df"/>
<text x="670" y="326" class="head">Task dispatcher</text>
<text x="670" y="358" class="body">TaskSchedulerService</text>
<text x="670" y="386" class="body">Region • capability • load</text>
<text x="670" y="414" class="body">Claim / lease / attempt fence</text>
<path d="M495 418 V451" class="line"/>
<path d="M790 418 V451" class="line"/>
<rect x="60" y="455" width="570" height="112" rx="12" fill="#fffdf5" stroke="#c7d5df"/>
<text x="80" y="489" class="head">SQLite / durable records</text>
<text x="80" y="521" class="body">Jobs / tasks / schedules • specs / config • audit</text>
<text x="80" y="549" class="body">Crawl • scripts / flow runs • webhook deliveries</text>
<rect x="650" y="455" width="280" height="112" rx="12" fill="#fff" stroke="#c7d5df"/>
<text x="670" y="489" class="head">Memory / rebuilt</text>
<text x="670" y="521" class="body">Agent registry • snapshots</text>
<text x="670" y="549" class="body">Challenges • plugin mirror</text>
<path d="M430 704 V590" class="line both"/>
<rect x="60" y="601" width="405" height="62" rx="12" fill="#f5f8fa" stroke="#f5f8fa"/>
<text x="66" y="626" class="body">WebSocket /v1/agent/ws</text>
<text x="66" y="654" class="small">Tasks ↓  results / heartbeats ↑</text>
<path d="M920 704 V590" class="line both"/>
<rect x="480" y="601" width="445" height="62" rx="12" fill="#f5f8fa" stroke="#f5f8fa"/>
<text x="483" y="626" class="body">HTTP POST ↑ / auth-code SSE ↓</text>
<text x="483" y="654" class="small">Session events / manual login challenges</text>
<rect x="60" y="668" width="865" height="28" rx="12" fill="#f5f8fa" stroke="#f5f8fa"/>
<text x="60" y="690" class="small">Both connections initiated by agents; TLS at the deployment edge</text>
<rect x="40" y="706" width="910" height="328" rx="12" fill="#eaf5f0" stroke="#9ebfad"/>
<text x="60" y="742" class="head">REGIONAL AGENTS / repeat per region, one or more agents</text>
<rect x="60" y="761" width="275" height="133" rx="12" fill="#fff" stroke="#c7d5df"/>
<text x="80" y="795" class="head">Task execution</text>
<text x="80" y="827" class="body">Serial task consumer</text>
<text x="80" y="855" class="body">Host actions: scripts / plugins</text>
<text x="80" y="883" class="body">Timeout / cancel / heartbeat</text>
<rect x="355" y="761" width="275" height="133" rx="12" fill="#fff" stroke="#c7d5df"/>
<text x="375" y="795" class="head">Steam session engine</text>
<text x="375" y="827" class="body">SessionManager</text>
<text x="375" y="855" class="body">BotSession • action queue</text>
<text x="375" y="883" class="body">Login / tokens / trade</text>
<rect x="650" y="761" width="280" height="133" rx="12" fill="#fff" stroke="#c7d5df"/>
<text x="670" y="795" class="head">Plugin runtime</text>
<text x="670" y="827" class="body">7 official plugins • hot load</text>
<text x="670" y="855" class="body">AssemblyLoadContext</text>
<text x="670" y="883" class="body">Same process; no sandbox</text>
<path d="M335 828 H355" class="line"/>
<path d="M650 854 H630" class="line"/>
<rect x="60" y="918" width="420" height="92" rx="12" fill="#fffdf5" stroke="#c7d5df"/>
<text x="80" y="952" class="head">Local credentials / tokens</text>
<text x="80" y="984" class="body">FileCredentialStore • AES-GCM</text>
<rect x="500" y="918" width="430" height="92" rx="12" fill="#fff" stroke="#c7d5df"/>
<text x="520" y="952" class="head">Steam access / cached reads</text>
<text x="520" y="984" class="body">SteamKit2 / ISteamTransport + HTTP</text>
<path d="M495 894 V906 H270 V918" class="line"/>
<path d="M495 906 H715 V918" class="line"/>
<path d="M715 1034 V1078" class="line"/>
<text x="60" y="1064" class="small">At-least-once delivery; duplicate side effects remain possible</text>
<rect x="40" y="1082" width="910" height="95" rx="12" fill="#fff" stroke="#c7d5df"/>
<text x="60" y="1116" class="head">Steam network / CM · Web API · Community · Store · CS2 GC</text>
<text x="60" y="1148" class="body">Persistent bot sessions use regional egress / optional account proxy</text>
<text x="1000" y="140" class="head">OPTIONAL INTEGRATIONS</text>
<rect x="1000" y="238" width="400" height="126" rx="12" fill="#fff" stroke="#c7d5df" stroke-dasharray="8 6"/>
<text x="1020" y="272" class="head">Notifications</text>
<text x="1020" y="304" class="body">External webhook receivers</text>
<text x="1020" y="332" class="body">HMAC signing • retry rules</text>
<text x="1020" y="360" class="body">Delivery log ≠ durable outbox</text>
<path d="M950 328 H1000" class="line optional"/>
<rect x="1000" y="440" width="400" height="146" rx="12" fill="#fff" stroke="#c7d5df" stroke-dasharray="8 6"/>
<text x="1020" y="474" class="head">Observability</text>
<text x="1020" y="506" class="body">Prometheus → Grafana</text>
<text x="1020" y="534" class="body">CP + Monitoring plugin metrics</text>
<text x="1020" y="562" class="body">OpenTelemetry traces / exporter</text>
<path d="M950 510 H1000" class="line optional"/>
<path d="M950 826 H975 V564 H1000" class="line optional"/>
<rect x="1000" y="918" width="400" height="92" rx="12" fill="#fff" stroke="#c7d5df" stroke-dasharray="8 6"/>
<text x="1020" y="952" class="head">Shared cache / Redis</text>
<text x="1020" y="984" class="body">VAPOR_REDIS; memory by default</text>
<path d="M930 968 H1000" class="line both optional"/>
<rect x="1000" y="1082" width="400" height="95" rx="12" fill="#fffdf5" stroke="#c7d5df"/>
<text x="1020" y="1116" class="head">Current boundaries</text>
<text x="1020" y="1148" class="body">No HA / external MQ / SSE replay</text>
<text x="40" y="1201" class="small">Solid = core path    Dashed = optional    Arrows = data flow, not socket initiation</text>
</svg>
