<!DOCTYPE html>
<!--

  form), so this fixture is a *constructed* skeleton — not a verbatim
  recording. Its embedded-data contract is cross-confirmed (2026-09-18)
  against four independent consumers of the live page:
    - johnnysparks' games/hours extractor (gist 5376855): locates the payload
      by "var rgGames = ", parses appid/name/hours_forever fields
    - icue/SteamTreemap steam_treemap.py: hours_forever comma-stripped then
      float(); entries without the field skipped
    - the "Steam 好友管理器" userscript (greasyfork 583222): regex
      var\s+rgGames\s*=\s*(\[[\s\S]*?\])\s*;
    - bendodson.com RSS extractor: matches "rgGames = " on the live page

  hours_forever is a display-formatted string ("1,234.5") and is null (or
  absent) for never-played games. A failing test here means the upstream
  structure drifted — re-record a real page and update this fixture.
-->
