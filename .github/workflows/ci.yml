name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: 10.0.x

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Verify .NET
      run: dotnet --info

    - name: Build ${{ matrix.configuration }}
      run: dotnet build -c "${{ matrix.configuration }}" -p:ContinuousIntegrationBuild=true --nologo

    # 限制 testhost 并行度（与 scripts/run-tests.sh 一致）：E2E 真实子进程与
    # CP 调度器等真实时钟测试在满核并行下偶发超时，限流后稳定。
    # --blame-hang：testhost 无进展 12 分钟即转储并快速失败——防 vstest 会话收尾
    # 失速（结果全部交付后宿主不退出）把 job 静默烧满 45 分钟（2026-09-17 实测，
    # 见 tests/TESTING.md「CI 挂死守护」与 todo §27）。
    # 注意 `--` 之后的 token 全部作为 runsettings 内联参数解析，必须放在最后。
    - name: Test ${{ matrix.configuration }}
      run: dotnet test -c "${{ matrix.configuration }}" -p:ContinuousIntegrationBuild=true --nologo --verbosity normal --blame-hang --blame-hang-timeout 12m -- RunConfiguration.MaxCpuCount=2

    # 挂死取证：--blame-hang 引爆时转储（hangdump + Sequence.xml）落在 TestResults/
    # 下，日志只有「在飞测试清单」。2026-09-17 首次发作的 dump 因无上传步骤丢失。
    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: testresults-${{ matrix.configuration }}-${{ matrix.os }}
        path: "**/TestResults/**"
        if-no-files-found: ignore

  coverage:
    # Full-solution test run with coverlet, uploading to Codecov. Split from the
    # build-test matrix so the Redis service (needed by the VAPOR_TEST_REDIS-gated
    # integration tests, which count toward coverage) can stay Linux-only.
    # tests/coverlet.runsettings excludes source-generator outputs; structural
    # integration shells carry [ExcludeFromCodeCoverage] in source.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      VAPOR_TEST_REDIS: localhost:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Build Release
      run: dotnet build -c Release -p:ContinuousIntegrationBuild=true --nologo

    # --blame-hang 同 build-test：coverage 的 job 级上限是 60 分钟，失速燃烧代价更高。
    # 逐项目串行收集（scripts/collect-coverage-serial.sh）：一次性全量跑法会间歇性
    # 产出某个项目的空（231 字节）cobertura 报告——并行 testhost 下 collector 刷盘
    # 竞态——静默丢掉该程序集的全部命中，门禁数字幻跌。串行实测未复发。
    - name: Test with coverage
      run: ./scripts/collect-coverage-serial.sh -p:ContinuousIntegrationBuild=true --blame-hang --blame-hang-timeout 12m -- RunConfiguration.MaxCpuCount=2

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: testresults-coverage
        path: "**/TestResults/**"
        if-no-files-found: ignore

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        # Branch protection makes Codecov reject tokenless uploads for main
        # ("Token required because branch is protected"); the repo token has
        # been in the CODECOV_TOKEN secret all along but was never referenced.
        token: ${{ secrets.CODECOV_TOKEN }}
        files: "**/TestResults/*/coverage.cobertura.xml"
        fail_ci_if_error: false

    # 覆盖率门禁：合计行/分支覆盖率跌破基线即红。基线与 tests/TESTING.md 的
    # 统计同步演进（2026-09-22 起行分母无残余缺口，合计基线精确 100.0%）。
    # 行门禁 100% —— 任何一行未覆盖（新增代码未带测试）即红。
    # 分支门禁 96.83：基线 5967/6165（显示 96.8%），门禁取两位小数 96.83——
    # 当前 96.837 过、丢一个条件 96.821 即红（棘轮，2026-09-22 分支缺口冲刺第三轮后设点）。
    - name: Coverage gate
      run: python3 scripts/coverage-summary.py TestResults/coverage-serial --min 100 --min-branch 96.83

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Verify formatting
      run: dotnet format Vapor.sln --verify-no-changes

  integration-redis:
    # Runs the VAPOR_TEST_REDIS-gated integration tests against a live Redis server.
    # On other jobs (and locally without the variable) those tests early-return.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      VAPOR_TEST_REDIS: localhost:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Test Redis cache integration
      run: dotnet test tests/Vapor.Steam.Core.Tests -c Release --nologo --filter "FullyQualifiedName~RedisVaporCacheIntegrationTests" --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        show-progress: false

    - name: Build control plane image
      run: docker build -f src/Vapor.ControlPlane/Dockerfile -t vapor/controlplane:ci .

    - name: Build agent image
      run: docker build -f src/Vapor.Agent/Dockerfile -t vapor/agent:ci .

    - name: Validate compose file
      run: docker compose config -q
