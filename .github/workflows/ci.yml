name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: 10.0.x

permissions: {}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Verify .NET
      run: dotnet --info

    - name: Build ${{ matrix.configuration }}
      run: dotnet build -c "${{ matrix.configuration }}" -p:ContinuousIntegrationBuild=true --nologo

    - name: Test ${{ matrix.configuration }}
      if: matrix.os != 'ubuntu-latest' || matrix.configuration != 'Release'
      run: dotnet test -c "${{ matrix.configuration }}" -p:ContinuousIntegrationBuild=true --nologo --verbosity normal

    - name: Test with coverage (Ubuntu Release)
      if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Release'
      run: dotnet test -c Release -p:ContinuousIntegrationBuild=true --no-build --nologo --collect "XPlat Code Coverage"

    - name: Upload coverage to Codecov (Ubuntu Release)
      if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Release'
      uses: codecov/codecov-action@v5
      with:
        files: "**/TestResults/*/coverage.cobertura.xml"
        fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        show-progress: false

    - name: Build control plane image
      run: docker build -f src/Vapor.ControlPlane/Dockerfile -t vapor/controlplane:ci .

    - name: Build agent image
      run: docker build -f src/Vapor.Agent/Dockerfile -t vapor/agent:ci .

    - name: Validate compose file
      run: docker compose config -q
