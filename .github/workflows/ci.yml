name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: 10.0.x

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Verify .NET
      run: dotnet --info

    - name: Build ${{ matrix.configuration }}
      run: dotnet build -c "${{ matrix.configuration }}" -p:ContinuousIntegrationBuild=true --nologo

    # 限制 testhost 并行度（与 scripts/run-tests.sh 一致）：E2E 真实子进程与
    # CP 调度器等真实时钟测试在满核并行下偶发超时，限流后稳定。
    # 注意 `--` 之后的 token 全部作为 runsettings 内联参数解析，必须放在最后。
    - name: Test ${{ matrix.configuration }}
      run: dotnet test -c "${{ matrix.configuration }}" -p:ContinuousIntegrationBuild=true --nologo --verbosity normal -- RunConfiguration.MaxCpuCount=2

  coverage:
    # Full-solution test run with coverlet, uploading to Codecov. Split from the
    # build-test matrix so the Redis service (needed by the VAPOR_TEST_REDIS-gated
    # integration tests, which count toward coverage) can stay Linux-only.
    # tests/coverlet.runsettings excludes source-generator outputs; structural
    # integration shells carry [ExcludeFromCodeCoverage] in source.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      VAPOR_TEST_REDIS: localhost:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Build Release
      run: dotnet build -c Release -p:ContinuousIntegrationBuild=true --nologo

    - name: Test with coverage
      run: dotnet test -c Release -p:ContinuousIntegrationBuild=true --no-build --nologo --collect "XPlat Code Coverage" --settings tests/coverlet.runsettings -- RunConfiguration.MaxCpuCount=2

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: "**/TestResults/*/coverage.cobertura.xml"
        fail_ci_if_error: false

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Verify formatting
      run: dotnet format Vapor.sln --verify-no-changes

  integration-redis:
    # Runs the VAPOR_TEST_REDIS-gated integration tests against a live Redis server.
    # On other jobs (and locally without the variable) those tests early-return.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      VAPOR_TEST_REDIS: localhost:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Test Redis cache integration
      run: dotnet test tests/Vapor.Steam.Core.Tests -c Release --nologo --filter "FullyQualifiedName~RedisVaporCacheIntegrationTests" --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        show-progress: false

    - name: Build control plane image
      run: docker build -f src/Vapor.ControlPlane/Dockerfile -t vapor/controlplane:ci .

    - name: Build agent image
      run: docker build -f src/Vapor.Agent/Dockerfile -t vapor/agent:ci .

    - name: Validate compose file
      run: docker compose config -q
