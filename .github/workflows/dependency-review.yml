name: dependency-review

on:
  pull_request:

permissions: {}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1 # v6.0.2
      with:
        show-progress: false

    - name: Review dependencies for known vulnerabilities
      uses: actions/dependency-review-action@v5.0.0 # v4.9.0
