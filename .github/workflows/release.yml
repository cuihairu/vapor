name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, osx-x64, osx-arm64, win-x64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SteamControl.sln

      - name: Compute version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish ControlPlane
        run: |
          dotnet publish src/SteamControl.ControlPlane/SteamControl.ControlPlane.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained false \
            -p:Version=${{ env.VERSION }} \
            -o dist/controlplane/${{ matrix.rid }}

      - name: Publish Agent
        run: |
          dotnet publish src/SteamControl.Agent/SteamControl.Agent.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained false \
            -p:Version=${{ env.VERSION }} \
            -o dist/agent/${{ matrix.rid }}

      - name: Package
        run: |
          mkdir -p release/stage/controlplane release/stage/agent
          cp -R dist/controlplane/${{ matrix.rid }}/. release/stage/controlplane/
          cp -R dist/agent/${{ matrix.rid }}/. release/stage/agent/
          cp README.md CHANGELOG.md LICENSE docs/running.md docs/releasing.md release/stage/controlplane/
          cp README.md CHANGELOG.md LICENSE docs/running.md docs/releasing.md release/stage/agent/
          (cd release/stage/controlplane && zip -r ../../SteamControl-ControlPlane-${{ github.ref_name }}-${{ matrix.rid }}.zip .)
          (cd release/stage/agent && zip -r ../../SteamControl-Agent-${{ github.ref_name }}-${{ matrix.rid }}.zip .)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-zips-${{ matrix.rid }}
          path: release/*.zip

  release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-zips-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
