name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, osx-x64, osx-arm64, win-x64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Vapor.sln

      - name: Compute version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish ControlPlane
        run: |
          dotnet publish src/Vapor.ControlPlane/Vapor.ControlPlane.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained false \
            -p:Version=${{ env.VERSION }} \
            -o dist/controlplane/${{ matrix.rid }}

      - name: Publish Agent
        run: |
          dotnet publish src/Vapor.Agent/Vapor.Agent.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained false \
            -p:Version=${{ env.VERSION }} \
            -o dist/agent/${{ matrix.rid }}

      - name: Package
        run: |
          mkdir -p release/stage/controlplane release/stage/agent
          cp -R dist/controlplane/${{ matrix.rid }}/. release/stage/controlplane/
          cp -R dist/agent/${{ matrix.rid }}/. release/stage/agent/
          cp README.md CHANGELOG.md LICENSE docs/running.md docs/releasing.md docs/production.md docs/troubleshooting.md release/stage/controlplane/
          cp README.md CHANGELOG.md LICENSE docs/running.md docs/releasing.md docs/production.md docs/troubleshooting.md release/stage/agent/
          (cd release/stage/controlplane && zip -r ../../Vapor-ControlPlane-${{ github.ref_name }}-${{ matrix.rid }}.zip .)
          (cd release/stage/agent && zip -r ../../Vapor-Agent-${{ github.ref_name }}-${{ matrix.rid }}.zip .)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-zips-${{ matrix.rid }}
          path: release/*.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          CP_TAGS="ghcr.io/${REPO}/controlplane:${VERSION}"
          AGENT_TAGS="ghcr.io/${REPO}/agent:${VERSION}"
          # Prerelease tags (contain '-') do not move :latest.
          if ! grep -q -- '-' <<< "$VERSION"; then
            CP_TAGS="${CP_TAGS}"$'\n'"ghcr.io/${REPO}/controlplane:latest"
            AGENT_TAGS="${AGENT_TAGS}"$'\n'"ghcr.io/${REPO}/agent:latest"
          fi
          {
            echo "cp_tags<<EOF"
            echo "$CP_TAGS"
            echo "EOF"
            echo "agent_tags<<EOF"
            echo "$AGENT_TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push control plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Vapor.ControlPlane/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.cp_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Vapor.Agent/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.agent_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-zips-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

