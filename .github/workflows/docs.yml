name: docs

# Builds the MkDocs Material site and publishes it to GitHub Pages.
# Runs on main pushes touching the docs surface, plus manual dispatch.
on:
  push:
    branches: [main]
    paths:
    - 'docs/**'
    - 'mkdocs.yml'
    - '.github/workflows/docs.yml'
    - 'README.md'
    - 'tests/TESTING.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one docs deployment at a time; new runs supersede pending ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1 # v6.0.2
      with:
        show-progress: false

    - name: Setup Python
      uses: actions/setup-python@v7.1.0 # v5.6.0
      with:
        python-version: '3.12'

    - name: Install mkdocs-material
      # Pinned minor lines: theme output changes between majors; bump deliberately.
      # mkdocs-static-i18n powers the suffix-based zh translations (mkdocs.yml
      # plugins.i18n) and must track the mkdocs-material minor line it supports.
      run: pip install "mkdocs-material==9.6.*" "mkdocs-static-i18n==1.3.*"

    # The testing overview lives in the repo as the source of truth; mirror it
    # into the site at build time so the docs stay a single-copy authority.
    - name: Mirror testing overview into docs
      run: cp tests/TESTING.md docs/testing.md

    # --strict turns broken internal links/nav entries into build failures.
    - name: Build site
      run: mkdocs build --strict --site-dir _site

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5.0.0 # v3
      with:
        path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5.0.1 # v4.0.13
