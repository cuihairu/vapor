name: codeql

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - "*.svg"
      - ".editorconfig"
  schedule:
  - cron: '23 4 * * 1'

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1 # v6.0.2
      with:
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0 # v5.1.0
      with:
        dotnet-version: 10.0.x

    - name: Initialize CodeQL
      uses: github/codeql-action/init@c20e34f438d671fc35777cc9820dd7adf8252874 # v3
      with:
        languages: csharp
        build-mode: manual

    - name: Build
      run: dotnet build -c Release --nologo

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@c20e34f438d671fc35777cc9820dd7adf8252874 # v3
      with:
        category: "/language:csharp"
