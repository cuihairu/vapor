# Codecov 覆盖率门禁（对照面，非权威）。
# 权威门禁在 CI coverage job：scripts/coverage-summary.py --min 100 --min-branch 100
# （2026-09-23 分支缺口冲刺第十三轮后：行 15887/15887、分支 6135/6135，行/分支双 100%）。
# 基线数字由 coverage-summary.py 合并全部 cobertura 报告计算（normalize 后按
# (程序集,文件,行) 取 max）。Codecov 自行聚合同一批上传的 cobertura，聚合口径
# 可能与本地脚本存在细微差异，故 project 留 1 个百分点阈值缓冲——真回退由 CI
# 硬门拦截，此处的边际价值是口径对照；patch 100% 与 CI 门禁同语义（新增行必须带测试）。
codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 1%
    patch:
      default:
        target: 100%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
